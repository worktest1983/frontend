<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ch8 表單排版(JS)</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .box {
            background: #f2f2f2;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row mb-5">

            <div class="display-5 text-bg-dark fw-900 text-center py-3 my-3">課程線上報名表</div>

            <div class="col-8">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="username" class="form-label">姓名</label>
                        <input type="text" class="form-control form-control-lg" id="username" placeholder="輸入2~8字元">
                        <div class="valid-feedback">符合規定</div>
                        <div class="invalid-feedback">姓名格式為2-8位數</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密碼</label>
                        <input type="text" class="form-control form-control-lg" id="password"
                            placeholder="密碼長度8~16,至少一個英文字母及一個數字">
                        <div class="valid-feedback">符合規定</div>
                        <div class="invalid-feedback">密碼格式為8-16位數,至少一個英文字母及一個數字</div>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Email</label>
                        <input type="email" class="form-control form-control-lg" id="email" placeholder="email須包含@及小數點">
                        <div class="valid-feedback">符合規定</div>
                        <div class="invalid-feedback">Email格式必須包含@及小數點</div>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">手機</label>
                        <input type="text" class="form-control form-control-lg" id="phone" placeholder="手機格式為10位數且為09開頭
                    ">
                        <div class="valid-feedback">符合規定</div>
                        <div class="invalid-feedback">手機格式為10位數且為09開頭</div>
                    </div>

                    <div class="mb-3">
                        <label for="city" class="form-label">居住縣市</label>
                        <select id="city" class="form-select form-select-lg is-invalid">
                        </select>
                        <div class="valid-feedback">已選擇縣市名稱</div>
                        <div class="invalid-feedback">未選擇縣市名稱</div>
                    </div>

                    <div class="mb-3">
                        <label for="" class="form-label">感興趣的課程(可複選)</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input type="checkbox" name="interest" id="chk01" class="form-check-input"
                                    value="html/CSS">
                                <label for="chk01" class="form-check-label">HTML/CSS</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="checkbox" name="interest" id="chk02" class="form-check-input"
                                    value="JavaScript">
                                <label for="chk02" class="form-check-label">JavaScript</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="checkbox" name="interest" id="chk03" class="form-check-input"
                                    value="Python">
                                <label for="chk03" class="form-check-label">Python</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="checkbox" name="interest" id="chk04" class="form-check-input" value="PHP">
                                <label for="chk04" class="form-check-label">PHP</label>
                            </div>

                            <div id="interest_msg" class="text-secondary">請至少選擇一項課程</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="" class="form-label">偏好上課方式(單選)</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="classMode" id="rad01" class="form-check-input" value="實體課程">
                                <label for="rad01" class="form-check-label">實體課程</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="classMode" id="rad02" class="form-check-input" value="線上課程">
                                <label for="rad02" class="form-check-label">線上課程</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input type="radio" name="classMode" id="rad03" class="form-check-input"
                                    value="線上實體混合課程">
                                <label for="rad03" class="form-check-label">線上實體混合課程</label>
                            </div>

                            <div id="classMode_msg" class="text-secondary">請選擇上課方式</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="" class="form-label">課程通知設定</label>
                        <div class="form-check form-switch">
                            <input type="checkbox" name="classNotify" id="classNotify01" class="form-check-input">
                            <label for="classNotify01">是否接收最新課程資訊</label>
                        </div>

                        <div id="classNotify_msg" class="text-secondary">目前狀態：關閉</div>
                    </div>

                    <div class="mb-3">
                        <label for="" class="form-label">
                            <span>成績能力自我評估</span>
                            <span class="text-primary fw-900 fs-3" id="grade">8分</span>
                        </label>
                        <div>
                            <input type="range" class="form-range" id="range" min="1" max="10" step="1" value="8">
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="">1: 完全不會</span>
                            <span class="">10: 非常熟悉</span>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center mt-3">
                    <button class="btn btn-primary" id="submit">確認送出</button>
                    <button class="btn btn-secondary" id="reset">重新填寫</button>
                </div>
            </div>

            <div class="col-4 box">
                <div class="row px-3">
                    <div class="col-12">
                        <div class="fs-3 text-success fw-900 my-3 py-3 text-center">報名資料確認</div>
                        <hr>
                    </div>
                    <div class="col-12" id="showMsg"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // ===========================================================
        // 課堂作業
        // 1. Email: 包含@這個字元，使用includes();8~15字。
        // 2. 密碼: 8~16字。
        // 3. 手機: 10個字；開頭為09-XXXXXXXX，使用startWith()
        // ===========================================================

        $(() => {

            let flag = false;
            let interest_arr = [];

            const getStorage = (name) => {
                const parm = localStorage.getItem(name);

                if (parm != null) {
                    $(`#${name}`).val(parm);
                    $(`#${name}`).trigger("input");
                }
            }

            getStorage('username');
            getStorage('email');
            getStorage('phone');

            // 正規表達
            const REGEX = {
                // 帳號：2～8 字元，英文字母
                account: /^[a-zA-Z]{2,8}$/,

                // 密碼：8～16 字元，至少一個英文字母及一個數字
                password: /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&._-]{8,16}$/,

                // Email：常見 Email 格式
                email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,

                // 台灣手機：09 開頭，共 10 碼
                phone: /^09\d{8}$/,
            };

            $("#username").on("change", function () {
                const _this = $(this);
                const name = _this.val();

                if (REGEX.account.test(name)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag = true;
                    localStorage.setItem('username', username);
                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag = false;
                }
            })

            $("#password").on("change", function () {
                const _this = $(this);
                const pwd = _this.val();

                if (REGEX.password.test(pwd)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag = true;
                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag = false;
                }
            })

            $("#email").on("change", function () {
                const _this = $(this);
                const email = _this.val();

                if (REGEX.email.test(email)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag = true;
                    localStorage.setItem('email', email);
                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag = false;
                }
            })

            $("#phone").on("change", function () {
                const _this = $(this);
                const phone = _this.val();

                if (REGEX.phone.test(phone)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag = true;
                    localStorage.setItem('phone', phone);
                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag = false;
                }
            })

            // 複選框
            $("input[name='interest']").on("change", function () {

                interest_arr = [];

                $("input[name='interest']:checked").each(function () {
                    interest_arr.push($(this).val());
                })

                if (interest_arr.length > 0) {
                    flag = true
                    $("#interest_msg")
                        .removeClass("text-secondary")
                        .addClass("text-success")
                        .text(`已選擇${interest_arr.length}項課程`);

                } else {
                    flag = false
                    $("#interest_msg")
                        .removeClass("text-success")
                        .addClass("text-danger")
                        .text("請至少選擇一項課程");
                }
            })

            // 單選框
            $("input[name='classMode']").on("change", function () {
                if ("input[name='classMode']:checked") {
                    flag = true;

                    $("#classMode_msg")
                        .removeClass("text-secondary")
                        .addClass("text-success")
                        .text(`已選擇【${$(this).val()}】為上課方式`);
                }
            })

            // Switch 開關
            $("input[name='classNotify']").on("change", function () {
                if ($(this).prop("checked")) {
                    $("#classNotify_msg")
                        .removeClass("text-secondary")
                        .addClass("text-success")
                        .text(`目前狀態：開啟`);
                } else {

                    $("#classNotify_msg")
                        .removeClass("text-success")
                        .addClass("text-secondary")
                        .text(`目前狀態：關閉`);
                }
            })

            // range
            $("#range").on("change", function () {
                const range = $(this).val();
                if (range) {
                    $("#grade").text(`${range}分`);
                }
            })

            // 表單送出
            $("#submit").on("click", () => {
                const username = $("#username").val();
                const password = $("#password").val();
                const email = $("#email").val();
                const phone = $("#phone").val();
                const classMode = $("input[name='classMode']:checked").val();
                const classNotify = $("input[name='classNotify']").prop("checked");
                const range = $("#range").val();

                if (flag) {
                    const strHtml = `
                    <div class="h5 my-3">姓名: ${username}</div>
                    <div class="h5 my-3">密碼: ${password}</div>
                    <div class="h5 my-3">Email: ${email}</div>
                    <div class="h5 my-3">手機: ${phone}</div>
                    <div class="h5 my-3">感興趣的課程: ${interest_arr.join(',')}
                    <div class="h5 my-3">上課方式: ${classMode}</div>
                    <div class="h5 my-3">是否接收最新課程資訊: ${classNotify ? '開啟' : '關閉'}</div>
                    <div class="h5 my-3">成績能力自我評估: ${range}分</div>`

                    $("#showMsg").html(strHtml);

                    clearStorage();

                } else {
                    Swal.fire({
                        title: "表單內容有誤，請修正",
                        icon: 'error'
                    }).then((result) => {
                        if (result.isConfirmed) location.href = "ex-ch8-20261022-01.html";
                    });
                }

            })

            // 清除表單
            $("#reset").on("click", function() {
                clearStorage();
                location.reload();
            })

            // 縣市選單，使用外部資料
            $.ajax({
                url: "json/CityCountyData.json",
                type: "GET",
                dataType: "JSON",
                success: showData_city,
                error: function () {
                    alert("error - json/CityCountyData.json")
                }
            })

            function showData_city(data) {
                $("#city").empty();
                let strHtml = `<option value="" selected disabled class="text-center">---請選擇縣市名稱---</option>`

                data.forEach(item => {
                    strHtml += `<option value="${item.CityName}">${item.CityName}</option>`;
                });

                $("#city").html(strHtml);

                $("#city").on("change", function () {
                    const _this = $(this);
                    const city = _this.val();

                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag = true;
                })
            }

            function clearStorage() {
                localStorage.removeItem("username");
                localStorage.removeItem("email");
                localStorage.removeItem("phone");
            }

        })
    </script>
</body>

</html>
