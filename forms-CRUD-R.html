<!doctype html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>CRUD練習 - 產品列表</title>
	<link rel="stylesheet" href="css/bootstrap.min.css" />
	<link rel="stylesheet" href="css/style.css" />
	<!-- Font Awesome -->
	<link rel="stylesheet" href="css/all.min.css" />
	<style>
		/* 莫蘭迪文青風專屬 CSS 變數與樣式微調 */
		:root {
			--morandi-bg: #f7f6f2;
			/* 燕麥奶灰底色 */
			--morandi-primary: #78857a;
			/* 莫蘭迪灰綠色 */
			--morandi-hover: #636f63;
			/* 灰綠深色懸停 */
			--morandi-card: #ffffff;
			/* 卡片白 */
			--morandi-text: #4a4a4a;
			/* 柔和深灰字 */
			--morandi-border: #dcdad3;
			/* 柔和邊框 */
		}

		body {
			background-color: var(--morandi-bg);
			color: var(--morandi-text);
			font-family:
				system-ui,
				-apple-system,
				"Segoe UI",
				Roboto,
				"Helvetica Neue",
				Arial,
				sans-serif;
		}

		.card {
			border: none;
			background-color: var(--morandi-card);
			box-shadow: 0 10rem 30rem rgba(120, 133, 122, 0.06) !important;
		}

		/* 輸入框與選擇器莫蘭迪化 */
		.form-control,
		.form-select {
			border-color: var(--morandi-border);
			background-color: #faf9f6;
			color: var(--morandi-text);
			border-radius: 0.5rem;
		}

		.form-control:focus,
		.form-select:focus {
			border-color: var(--morandi-primary);
			box-shadow: 0 0 0 0.25rem rgba(120, 133, 122, 0.15);
			background-color: #fff;
		}

		/* 莫蘭迪風格按鈕 */
		.btn-morandi-primary {
			background-color: var(--morandi-primary);
			color: #fff;
			border: none;
			transition: all 0.2s ease;
		}

		.btn-morandi-primary:hover {
			background-color: var(--morandi-hover);
			color: #fff;
		}

		.btn-morandi-outline {
			border: 1px solid var(--morandi-border);
			color: var(--morandi-text);
			background-color: transparent;
			transition: all 0.2s ease;
		}

		.btn-morandi-outline:hover {
			background-color: #f0eee9;
			color: var(--morandi-text);
		}

		/* 滑桿微調 */
		.form-range::-webkit-slider-thumb {
			background: var(--morandi-primary);
		}
	</style>
</head>

<body>
	<header>
		<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
			<div class="container-fluid">
				<a class="navbar-brand" href="#">CRUD練習</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
					aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNav">
					<ul class="navbar-nav">
						<li class="nav-item">
							<a class="nav-link" aria-current="page" href="#">Home</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="forms-CRUD-C.html">產品建檔</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" href="forms-CRUD-R.html">產品列表</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</header>
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-12 col-md-12">
				<div class="card rounded-4 overflow-hidden shadow-sm">
					<!-- 表單標頭：莫蘭迪灰綠色系 -->
					<div class="card-header text-white p-4" style="background-color: #78857a">
						<div class="h4 mb-0 text-center fw-bold tracking-wide">
							<i class="fa-solid fa-feather me-2"></i>產品列表
						</div>
					</div>

					<div class="card-body">
						<table class="table table-bordered table-hover table-sm table-rwd" id="product_list">
							<thead class="text-white" style="background-color: #78857a;">
								<tr class="text-center">
									<th width="20%" class="py-2">產品名稱</th>
									<th width="10%" class="py-2">產品價格</th>
									<th width="10%" class="py-2">產品數量</th>
									<th width="10%" class="py-2">產品分類</th>
									<th width="30%" class="py-2">產品備註</th>
									<th width="30%" class="py-2">操作</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>

						<nav aria-label="Page navigation example">
							<ul class="pagination justify-content-end" id="pageList"></ul>
						</nav>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Modal -->
	<div class="modal fade" id="edit" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
		aria-labelledby="staticBackdropLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-warning">
					<h1 class="modal-title fs-5" id="staticBackdropLabel">產品編輯</h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="card-body">
						<form id="productForm" novalidate>
							<!-- 產品名稱 -->
							<div class="form-floating mb-4">
								<input type="text" name="product_name" id="product_name" class="form-control"
									placeholder="產品名稱" value="" disabled readonly>
								<label for="product_name" class="text-muted">
									<i class="fa-solid fa-tag me-1"></i>產品名稱
								</label>
								<div class="invalid-feedback">必填欄位，且名稱字數限制 2 ~ 10 字內</div>
							</div>

							<!-- 價格與類別 (雙欄排版) -->
							<div class="row g-3 mb-4">
								<div class="col-md-6">
									<div class="form-floating">
										<input type="number" name="product_price" id="product_price"
											class="form-control" placeholder="價格" min="0" value="">
										<label for="product_price" class="text-muted">
											<i class="fa-solid fa-dollar-sign me-1"></i>價格
										</label>
										<div class="invalid-feedback">金額不能為空，且不超過100</div>
									</div>
								</div>

								<div class="col-md-6">
									<div class="form-floating">
										<select name="product_category" id="product_category" class="form-select"
											disabled>
											<option value="" disabled selected>請選擇類別</option>
											<option value="零食">零食</option>
											<option value="乳製品">乳製品</option>
											<option value="飲料">飲料</option>
											<option value="日用品">日用品</option>
										</select>
										<label for="product_category" class="text-muted">
											<i class="fa-solid fa-folder-open me-1"></i>產品類別
										</label>
									</div>
								</div>
							</div>

							<!-- 數量 (Range 滑桿) -->
							<div class="mb-4 p-3 rounded-4 border"
								style="background-color: #faf9f6; border-color: #ebe7de !important;">
								<div class="d-flex justify-content-between align-items-center mb-2">
									<label for="product_num" class="form-label mb-0 fw-semibold text-secondary">
										<i class="fa-solid fa-cubes me-1"></i>數量
									</label>
									<div>
										<span class="h3 fw-bold" style="color: #78857a;" id="product_num_val">50</span>
										<span class="text-muted small">個</span>
									</div>
								</div>
								<input type="range" class="form-range" id="product_num" name="product_num" min="1"
									max="100" step="1" value="50">
							</div>

							<!-- 備註 -->
							<div class="form-floating mb-3">
								<textarea name="product_remark" id="product_remark" class="form-control"
									placeholder="產品說明及注意事項，上限200字" style="height: 120px" disabled readonly>
									...
                                </textarea>
								<label for="product_remark" class="text-muted">
									<i class="fa-solid fa-note-sticky me-1"></i>備註（上限 200 字）
								</label>
							</div>
						</form>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
					<button type="button" class="btn btn-primary" id="update">更新</button>
				</div>
			</div>
		</div>

		<!-- Scripts -->
		<script src="js/bootstrap.min.js"></script>
		<script src="js/jquery-4.0.0.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

		<script>
			const pageSize = 10;
			let page = 1;
			let productData = [];
			let pid;

			$(() => {

				getData();

				// Page
				$("#pageList").on("click", ".page-link", function () {
					page = Number($(this).data('page'));
					showData(productData);
				})

				// Update ----------------------
				$("#product_list tbody").on("click", ".btn-update", function () {
					const id = $(this).data("id");
					pid = $(this).data("id");

					$.ajax({
						type: "GET",
						url: 'http://localhost:3000/product/' + id,
						dataType: 'JSON',
						success: (data) => {
							$("#product_name").val(data.name);
							$("#product_price").val(data.price);
							$("#product_num_val").text(data.num);
							$("#product_num").val(data.num);
							$("#product_remark").text(data.remark);
							$("#product_category").val(data.category);
						}
					})
				})

				// 滑桿
				$("#product_num").on("input change", function () {
					$("#product_num_val").text($(this).val());
				});

				// 欄位驗證
				$("#product_price").on("change", function () {
					const price = Number($(this).val());

					if (price >= 1 && price <= 100) {
						$(this).removeClass("is-invalid");
					} else {
						$(this).addClass("is-invalid");
					}
				});


				// Update to Server
				$("#update").on("click", function () {
					const price = Number($("#product_price").val());
					const num = Number($("#product_num").val());

					const parms = {
						price: price,
						num: num
					}

					$.ajax({
						type: 'PATCH',
						url: 'http://localhost:3000/product/' + pid,
						dataType: 'JSON',
						data: JSON.stringify(parms),
						contentType: "application/json",
						success: () => {
							// 關閉modal
							bootstrap.Modal.getInstance(document.getElementById("edit")).hide();

							Swal.fire({
								title: "更新成功",
								icon: "success",
								showConfirmButton: false,
								timer: 1500
							}).then((result) => {
								// window.location.reload();
								getData();
							});
						},
						error: () => {
							Swal.fire({
								title: "更新產品資料失敗",
								text: "請檢查資料格式或連線是否正常",
								icon: "error",
								confirmButtonColor: "#78857a"
							});
						}
					})
				})


				// Delete -----------------------------
				$("#product_list").on("click", ".btn-del", function () {
					const id = $(this).data("id");

					Swal.fire({
						title: "確認刪除?",
						icon: "question",
						showDenyButton: true,
						showCancelButton: false,
						confirmButtonText: "確認",
						denyButtonText: `取消`
					}).then((result) => {
						if (result.isConfirmed) {
							$.ajax({
								url: "http://localhost:3000/product/" + id,
								type: "DELETE",
								success: () => {
									Swal.fire({
										title: "刪除成功",
										icon: "success",
										showConfirmButton: false,
										timer: 1500
									}).then((result) => {
										$.ajax({
											type: "GET",
											url: 'http://localhost:3000/product',
											dataType: "JSON",
											success: (data) => {
												// 避免刪除後頁碼錯誤
												const totalPage = Math.ceil(data.length / pageSize);

												if (page > totalPage) {
													page = Math.max(1, totalPage);
												}

												showData(data);
											},
											error: () => {
												Swal.fire({
													title: "讀取失敗",
													text: "無法連接後端API",
													icon: "error",
												});
											}
										})
									});
								},
								error: () => {
									Swal.fire({
										title: "刪除失敗",
										text: "請檢查連線是否正常",
										icon: "error",
									});
								}
							})
						} else if (result.isDenied) return;
					});
				});
			});


			// 取得資料
			function getData() {
				$.ajax({
					type: "GET",
					url: 'http://localhost:3000/product',
					dataType: "JSON",
					success: showData,
					error: () => {
						Swal.fire({
							title: "讀取失敗",
							text: "無法連接後端API",
							icon: "error",
						});
					}
				})
			}

			// 產品列表
			function showData(data) {

				productData = data;

				const pageData = pagnation(data, pageSize, page);

				$("#product_list tbody").empty();
				$("#pageList").empty();

				if (data) {
					let strHtml = '';

					pageData.forEach(items => {
						strHtml +=
							`<tr>
								<td data-th="產品名稱">${items.name}</td>
								<td data-th="產品價格" class="text-end">${items.price}</td>
								<td data-th="產品數量" class="text-center">${items.num}</td>
								<td data-th="產品分類" class="text-center">${items.category}</td>
								<td data-th="產品備註">${items.remark}</td>
								<td data-th="功能操作" class="text-center">
									<button class="btn btn-warning btn-update" data-bs-toggle="modal" data-bs-target="#edit" data-id=${items.id}>編輯</button>
									<button class="btn btn-danger btn-del" data-id=${items.id}>刪除</button>
								</td>
							</tr>`
					});

					$("#product_list tbody").append(strHtml);


					// 頁碼
					let pageHtml = ''

					if (page > 1) {
						pageHtml += `
							<li class="page-item">
								<a class="page-link" href="#" data-page=${page - 1}>
									<span aria-hidden="true">&laquo;</span>
								</a>
							</li>`
					}

					const totalPage = Math.ceil(data.length / pageSize);

					for (let i = 1; i <= totalPage; i++) {
						const active = i === page ? 'active' : '';
						pageHtml += `<li class="page-item ${active}"><a class="page-link" href="#" data-page=${i}>${i}</a></li>`

					}

					if (page < totalPage) {
						pageHtml += `
							<li class="page-item">
								<a class="page-link" href="#" data-page=${page + 1}>
									<span aria-hidden="true">&raquo;</span>
								</a>
							</li>`;
					}

					$("#pageList").append(pageHtml);

				}
			}

			// Page
			function pagnation(data, pageSize, page) {
				const start = (page - 1) * pageSize
				const end = start + pageSize
				return data.slice(start, end)
			}
		</script>
</body>

</html>
