<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切版練習二</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .banner {
            background: url(images/01.jpg) no-repeat 50% 50%;
            background-size: cover;
            width: 100%;
            height: 120px;
        }

        .navItem {
            height: 140px;
            background: #a1d4df;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
        }

        @media screen and (min-width: 992px) {
            .navItem {
                width: 200px;
                height: 200px;
                border-radius: 50%;
            }
        }

        @media screen and (min-width: 1200px) {
            .navItem {
                width: 220px;
                height: 220px;
                border-radius: 50%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-12 d-none d-sm-block">
                <div class="banner"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6 col-md-3 mt-4">
                <div class="navItem">選單01</div>
            </div>
            <div class="col-sm-6 col-md-3 mt-4">
                <div class="navItem">選單02</div>
            </div>
            <div class="col-sm-6 col-md-3 mt-4">
                <div class="navItem">選單03</div>
            </div>
            <div class="col-sm-6 col-md-3 mt-4">
                <div class="navItem">選單04</div>
            </div>
        </div>

        <div class="row mt-3" id="travelFoodList"></div>

        <div class="row mt-3">
            <div class="col-12 bg-secondary py-3 text-center fs-5 fw-900 d-none d-md-block">POWER BY XXX 2026.10</div>
        </div>
    </div>

    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>

    <script>
        $(function () {

            $.ajax({
                type: "GET",
                url: "http://localhost:3000/travelFood",
                dataType: "json",
                success: showData,
                error: function () {
                    console.log("Conect Error");
                }
            })

            function showData(data) {
                let str = '';
                
                data.forEach((items, index) => {
                    console.log(items.Name);
                    
                    str += `
                    <div class="col-md-6 col-lg-4">
                        <img src="${items.PicURL}" alt="" height="250px">
                        <div class="text-center h3 fw-900 mt-3">${items.Name}</div>
                        <div class="h4">地址: ${items.Address}</div>
                        <div class="h4">電話: ${items.Tel}</div>
                        <div class="h4">簡介: ${items.HostWords}</div>
                    </div></div>`;
                });
                

                $('#travelFoodList').append(str);
            }
        })
    </script>
</body>

</html>
