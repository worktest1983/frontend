<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SU Hotel</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awsome -->
    <link rel="stylesheet" href="css/all.min.css">
</head>

<body>
    <!-- 01 Top Link -->
    <section id="topLink" class="position-absolute start-0 w-100" style="top: 2%; z-index: 100">
        <div class="row py-2 px-5">
            <div class="text-end">
                <a href="#" class="text-light mx-3">
                    <i class="fa-solid fa-earth-americas"></i>繁中
                </a>
                <a href="#" class="text-light">
                    <i class="fa-brands fa-instagram social-icon"></i>
                </a>
                <a href="#" class="text-light">
                    <i class="fa-brands fa-facebook social-icon"></i>
                </a>
            </div>
        </div>
    </section>

    <!-- 02 Nav -->
    <section id="nav">
        <div class="container">
            <div class="row position-absolute w-100 align-items-center" style="top:5%; left: 0%; z-index: 99">
                <div class="col-md-3 text-center">
                    <h1 class="h1">
                        <a class="navbar-brand" href="#">
                            <img src="images/hotel/logo.png" alt="" style="width: 120px">
                        </a>
                    </h1>
                </div>
                <div class="col-md-9">
                    <nav class="navbar navbar-expand-lg navbar-light rounded w-90"
                        style="background: rgba(255, 255, 255, .6);">
                        <div class="container">
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                                aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                                <ul class="navbar-nav gap-5">
                                    <li class="nav-item">
                                        <a class="nav-link active" aria-current="page" href="#brand">關於SU</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#rooms">客房住宿</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#dining">餐飲體驗</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#spa">慢活時光</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="#gallery">空間巡禮</a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </section>

    <!-- 03 Banner -->
    <section id="banner">
        <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="false">
            <div class="carousel-inner">
                <div class="carousel-item active bg-img-cover"
                    style="background-image: url(images/hotel/room05.jpg); height: 100vh;">

                    <div class="container hero-content">
                        <p class="eyebrow text-white">A QUIET PLACE TO BE</p>
                        <h1>慢一點，<br>感受生活的美好。</h1>
                        <p class="hero-copy">在自然、光線與安定之間，<br class="d-sm-none">找回生活最舒服的步調。</p>
                        <a href="#rooms" class="btn btn-outline-light rounded-pill px-4 py-2">探索 SU Hotel <i
                                class="fa-solid fa-arrow-down ms-2"></i></a>
                    </div>

                </div>
                <div class="carousel-item bg-img-cover"
                    style="background-image: url(images/hotel/lobby02.jpg); height: 85vh;">
                </div>
                <div class="carousel-item bg-img-cover"
                    style="background-image: url(images/hotel/room03.jpg); height: 85vh;">
                </div>
                <div class="carousel-item bg-img-cover"
                    style="background-image: url(images/hotel/dinning01.jpg); height: 85vh;">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>

    <!-- 04 Brand Philosophy 品牌核心理念 -->
    <section id="brand"></section>

    <!-- 05 Rooms -->
    <section id="rooms"></section>

    <!-- 06 Location & Surroundings -->
    <section id="section06"></section>

    <!-- 07 Dining & Café -->
    <section id="dining"></section>

    <!-- 08 Wellness & Spa -->
    <section id="spa"></section>

    <!-- 09 Activities & Experiences -->
    <section id="activity"></section>

    <!-- 10 News -->
    <section id="news"></section>

    <!-- 11 Gallery -->
    <section id="gallery"></section>

    <!-- 12 The Story (Timeline)-->
    <section id="about"></section>

    <!-- 13 FAQ -->
    <section id="faq"></section>

    <!-- 14 Transportation-->
    <section id="transportation"></section>

    <!-- 15 Footer -->
    <section id="footer"></section>

    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
</body>

</html>
