<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ch8 表單排版(JS)</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">

<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="display-4 text-bg-warning fw-900 text-center py-3 my-3">課程線上報名表</div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">姓名</label>
                    <input type="text" class="form-control form-control-lg" id="username" placeholder="輸入2~8字元">
                    <div class="valid-feedback">符合規定</div>
                    <div class="invalid-feedback">姓名格式為2-8位數</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="text" class="form-control form-control-lg" id="password"
                        placeholder="密碼長度8~16,至少一個英文字母及一個數字">
                    <div class="valid-feedback">符合規定</div>
                    <div class="invalid-feedback">密碼格式為8-16位數,至少一個英文字母及一個數字</div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Email</label>
                    <input type="email" class="form-control form-control-lg" id="email" placeholder="email須包含@及小數點">
                    <div class="valid-feedback">符合規定</div>
                    <div class="invalid-feedback">Email格式必須包含@及小數點</div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">手機</label>
                    <input type="text" class="form-control form-control-lg" id="phone" placeholder="手機格式為10位數且為09開頭
                    ">
                    <div class="valid-feedback">符合規定</div>
                    <div class="invalid-feedback">手機格式為10位數且為09開頭</div>
                </div>
            </div>
            <div class="col-12 text-center mt-3">
                <button class="btn btn-primary" id="submit">確認送出</button>
                <button class="btn btn-secondary" id="reset">重新填寫</button>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="display-6 text-danger fw-900 my-3 py-3">報名資料確認</div>
            </div>
            <div class="col-12" id="showMsg"></div>
        </div>
    </div>

    <script src="js/bootstrap.min.js"></script>

            // ===========================================================
            // 課堂作業
            // 1. Email: 包含@這個字元，使用includes();8~15字。
            // 2. 密碼: 8~16字。
            // 3. 手機: 10個字；開頭為09-XXXXXXXX，使用startWith()
            // ===========================================================

            // 正規表達
            const REGEX = {
                // 帳號：2～8 字元，英文字母
                account: /^[a-zA-Z]{2,8}$/,

                // 密碼：8～16 字元，至少一個英文字母及一個數字
                password: /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&._-]{8,16}$/,

                // Email：常見 Email 格式
                email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,

                // 台灣手機：09 開頭，共 10 碼
                phone: /^09\d{8}$/,
            };

            $("#username").on("change", function () {
                const _this = $(this);
                const name = _this.val();

                // if (name.length > 1 && name.length < 9) {
                if (REGEX.account.test(name)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag_username = true;

                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag_username = false;
                }
            })

            $("#password").on("change", function () {
                const _this = $(this);
                const pwd = _this.val();

                // if (pwd.length > 8 && pwd.length < 17) {
                if (REGEX.password.test(pwd)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag_username = true;

                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag_username = false;
                }
            })

            $("#email").on("change", function () {
                const _this = $(this);
                const email = _this.val();

                // if (email.length > 7 && email.length < 16 && email.includes('@')) {
                if (REGEX.email.test(email)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag_username = true;

                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag_username = false;
                }
            })

            $("#phone").on("change", function () {
                const _this = $(this);
                const phone = _this.val();

                // if (phone.length == 10 && phone.startsWith('09')) {
                if (REGEX.phone.test(phone)) {
                    _this.removeClass("is-invalid").addClass("is-valid");
                    flag_username = true;

                } else {
                    _this.removeClass("is-valid").addClass("is-invalid");
                    flag_username = false;
                }
            })

            $("#submit").on("click", () => {
                const username = $("#username").val();
                const password = $("#password").val();
                const email = $("#email").val();
                const phone = $("#phone").val();

                const show = flag_username ? alert("符合規定") : alert("不符合規定");

                const strHtml = `<div class="h2">姓名: ${username}</div><div class="h2">密碼: ${password}</div><div class="h2">Email: ${email}</div><div class="h2">手機: ${phone}</div>`
                $("#showMsg").html(strHtml);

            })
