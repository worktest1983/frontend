<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        .box {
            height: 150px;
        }
    </style>
</head>

<body>
    <div class="container pb-5">

        <div class="title-02 my-4">3. display none and block</div>

        <div class="row">
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box bg-warning">1</div>
            </div>
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box bg-warning">2</div>
            </div>
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box bg-warning">3</div>
            </div>
            <div class="col-3 d-sm-none d-lg-block">
                <div class="box bg-warning">4</div>
            </div>
        </div>


        <div class="title-02 my-4">4. offset</div>

        <div class="row">
            <div class="col-6 offset-lg-6">
                <div class="box bg-primary"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-4 mt-3 offset-lg-4 offset-xxl-8">
                <div class="box bg-danger"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4 mt-4">
                <div class="box bg-success"></div>
            </div>
            <div class="col-lg-4 mt-4 d-none d-lg-block">
                <div class="box bg-danger">AAAAAA</div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-4 mt-4 offset-lg-4">
                <div class="box bg-success"> </div>
            </div>
            <div class="col-lg-4 mt-4 d-none d-lg-block">
                <div class="box bg-warning">BBBBB</div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-4 mt-4 offset-lg-8">
                <div class="box bg-success"> </div>
            </div>
        </div>

        <div class="title-02 my-4">5. Gutter</div>
        <div class="row g-2 g-lg-0">
            <div class="col-md-4">
                <div class="box bg-info"></div>
            </div>
            <div class="col-md-4">
                <div class="box bg-info"></div>
            </div>
            <div class="col-md-4">
                <div class="box bg-info"></div>
            </div>
            <div class="col-md-4">
                <div class="box bg-info"></div>
            </div>
            <div class="col-md-4">
                <div class="box bg-info"></div>
            </div>
            <div class="col-md-4">
                <div class="box bg-info"></div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-2">
                <div class="box bg-primary" style="height: 450px;"></div>
            </div>
            <div class="col-10">
                <div class="row g-1">
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                    <div class="col-3">
                        <div class="box bg-danger"></div>
                    </div>
                </div>
            </div>
        </div>
        

        <div class="title-02 my-4">6. row-cols-{breakpoints}-{colums}</div>
        <div class="row row-cols-2 row-cols-md-5 g-2">
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
            <div class="col">
                <div class="box bg-warning"></div>
            </div>
        </div>

    </div>

    <script src="js/bootstrap.min.js"></script>

</body>

</html>
