<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Table</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="display-2 text-center mt-4">產品列表</div> 
        
        <table class="table mt-4 table-bordered text-center table-striped table-hover table-sm">
            <thead class="table-dark">
                <tr>
                    <th>產品編號</th>
                    <th>產品名稱</th>
                    <th>產品價格</th>
                    <th>產品數量</th>
                    <th>產品備註</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>美式咖啡</td>
                    <td>60</td>
                    <td>10</td>
                    <td>無糖去冰</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>拿鐵咖啡</td>
                    <td>60</td>
                    <td>10</td>
                    <td>無糖去冰</td>
                </tr>
                <tr>
                    <td>03</td>
                    <td>西西里咖啡</td>
                    <td>60</td>
                    <td>10</td>
                    <td>無糖去冰</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    
    <script></script>
</body>
</html>
