<!doctype html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>CRUD練習 - 產品列表</title>
	<link rel="stylesheet" href="css/bootstrap.min.css" />
	<link rel="stylesheet" href="css/style.css" />
	<!-- Font Awesome -->
	<link rel="stylesheet" href="css/all.min.css" />
	<style>
		/* 莫蘭迪文青風專屬 CSS 變數與樣式微調 */
		:root {
			--morandi-bg: #f7f6f2;
			/* 燕麥奶灰底色 */
			--morandi-primary: #78857a;
			/* 莫蘭迪灰綠色 */
			--morandi-hover: #636f63;
			/* 灰綠深色懸停 */
			--morandi-card: #ffffff;
			/* 卡片白 */
			--morandi-text: #4a4a4a;
			/* 柔和深灰字 */
			--morandi-border: #dcdad3;
			/* 柔和邊框 */
		}

		body {
			background-color: var(--morandi-bg);
			color: var(--morandi-text);
			font-family:
				system-ui,
				-apple-system,
				"Segoe UI",
				Roboto,
				"Helvetica Neue",
				Arial,
				sans-serif;
		}

		.card {
			border: none;
			background-color: var(--morandi-card);
			box-shadow: 0 10rem 30rem rgba(120, 133, 122, 0.06) !important;
		}

		/* 輸入框與選擇器莫蘭迪化 */
		.form-control,
		.form-select {
			border-color: var(--morandi-border);
			background-color: #faf9f6;
			color: var(--morandi-text);
			border-radius: 0.5rem;
		}

		.form-control:focus,
		.form-select:focus {
			border-color: var(--morandi-primary);
			box-shadow: 0 0 0 0.25rem rgba(120, 133, 122, 0.15);
			background-color: #fff;
		}

		/* 莫蘭迪風格按鈕 */
		.btn-morandi-primary {
			background-color: var(--morandi-primary);
			color: #fff;
			border: none;
			transition: all 0.2s ease;
		}

		.btn-morandi-primary:hover {
			background-color: var(--morandi-hover);
			color: #fff;
		}

		.btn-morandi-outline {
			border: 1px solid var(--morandi-border);
			color: var(--morandi-text);
			background-color: transparent;
			transition: all 0.2s ease;
		}

		.btn-morandi-outline:hover {
			background-color: #f0eee9;
			color: var(--morandi-text);
		}

		/* 滑桿微調 */
		.form-range::-webkit-slider-thumb {
			background: var(--morandi-primary);
		}
	</style>
</head>

<body>
	<header>
		<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
			<div class="container-fluid">
				<a class="navbar-brand" href="#">CRUD練習</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
					aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarNav">
					<ul class="navbar-nav">
						<li class="nav-item">
							<a class="nav-link" aria-current="page" href="#">Home</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="forms-CRUD-C.html">產品建檔</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" href="forms-CRUD-R.html">產品列表</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</header>
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-12 col-md-12">
				<div class="card rounded-4 overflow-hidden shadow-sm">
					<!-- 表單標頭：莫蘭迪灰綠色系 -->
					<div class="card-header text-white p-4" style="background-color: #78857a">
						<div class="h4 mb-0 text-center fw-bold tracking-wide">
							<i class="fa-solid fa-feather me-2"></i>產品列表
						</div>
					</div>

					<div class="card-body">
						<table class="table mt-4 table-bordered table-hover table-sm table-rwd" id="product_list">
							<thead class="table-dark">
								<tr>
									<th>產品名稱</th>
									<th>產品價格</th>
									<th>產品數量</th>
									<th>產品分類</th>
									<th>產品備註</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Scripts -->
	<script src="js/bootstrap.min.js"></script>
	<script src="js/jquery-4.0.0.js"></script>

	<script>
		$(() => {

			$.ajax({
				type: "GET",
				url: 'http://localhost:3000/product',
				dataType: "JSON",
				success: showData,
				error: () => {
					Swal.fire({
						title: "讀取失敗",
						text: "無法連接後端API",
						icon: "error",
					});
				}
			})

			function showData(data) {
				if (data) {
					console.log(data);

					let strHtml = '';

					data.forEach(items => {
						
						strHtml += 
							`<tr>
								<td data-th="產品名稱">${items.name}</td>
								<td data-th="產品價格">${items.price}</td>
								<td data-th="產品數量">${items.num}</td>
								<td data-th="產品分類">${items.category}</td>
								<td data-th="產品備註">${items.remark}</td>
							</tr>`
					});

					$("#product_list tbody").append(strHtml);
				}
			}
		});
	</script>
</body>

</html>
